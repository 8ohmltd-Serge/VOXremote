<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f2ef">
  <title>VOXORDIA · Ответ на приглашение</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/invitation/styles.css">
  <script src="/theme.js"></script>
  <script src="/invitation/app.js" defer></script>
</head>
<body>
  <header><img class="logo-light" src="/assets/logo.svg" alt="VOXORDIA"><img class="logo-dark" src="/assets/logo-on-dark.svg" alt="" aria-hidden="true"></header>
  <main>
    <section class="invitation" aria-labelledby="heading">
      <h1 id="heading">Участие в конференции</h1>
      <p id="status" role="status" aria-live="polite">Проверяем приглашение…</p>
      <div id="details" hidden>
        <p id="meetingTitle" class="meeting-title"></p>
        <p id="meetingTime"></p>
        <p id="roomName"></p>
        <p id="roomAddress"></p>
        <p id="ucMeeting" hidden></p>
        <p id="participationFormat"></p>
        <p id="participantName"></p>
      </div>
      <div id="actions" class="actions" hidden>
        <button type="button" id="accept">Подтвердить участие</button>
        <button type="button" id="decline" class="secondary">Не смогу участвовать</button>
      </div>
      <p class="note">Ссылка на вход и QR-код остаются в исходном приглашении.</p>
    </section>
  </main>
  <footer>VOXORDIA · Ответ доступен только по персональной ссылке</footer>
</body>
</html>
