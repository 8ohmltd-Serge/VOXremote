<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><link rel="icon" href="data:," type="image/x-icon"><title>VOXORDIA · Панель организатора</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717;background:#f4f3f0}
  *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
  main{width:min(100%,540px);padding:28px;background:#fff;border:1px solid #ddd8d1;border-radius:16px;box-shadow:0 14px 40px #17171712}
  .brand{font-weight:850;font-size:15px;letter-spacing:.12em}.brand span{color:#e4322e}h1{font-size:clamp(24px,5vw,32px);line-height:1.14;margin:22px 0 12px}
  p{line-height:1.5;color:#555}label{display:grid;gap:7px;font-weight:650}input{font:inherit;padding:13px;border:1px solid #aaa;border-radius:8px;width:100%}
  button{font:inherit;font-weight:700;border:0;border-radius:8px;background:#151515;color:#fff;min-height:46px;padding:10px 18px;cursor:pointer}
  button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #2789d2;outline-offset:2px}
  form{display:grid;gap:14px}.status{padding:14px;border:1px solid #d8d2ca;border-radius:9px;background:#f8f7f5;color:#282623;margin:16px 0}
  .status.muted{background:#fff0e8;border-color:#ee9d78;color:#8a2d13}.status.live{background:#ecf7ed;border-color:#9dcea6;color:#155b26}
  .actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:180px}.secondary{background:#fff;color:#171717;border:1px solid #bbb}
  small{display:block;margin-top:16px;color:#666;line-height:1.45}
</style></head><body><main><div class="brand">V<span>O</span>XORDIA</div><h1>Панель организатора удалённого зала</h1>
<form id="claim"><label>Код организатора<input id="code" autocomplete="one-time-code" inputmode="text" maxlength="14" required placeholder="Код из плана конференции"></label><button type="submit">Открыть панель</button></form>
<section id="panel" hidden><p id="identity"></p><div id="status" class="status" role="status" aria-live="polite">Проверка подключения…</div><div class="actions"><button id="mute" type="button" disabled>Отключить звук зала</button><button id="refresh" type="button" class="secondary">Обновить</button></div><small>Эта кнопка управляет звуком удалённого зала в конференции VOX-S. Она не отключает микрофоны людей внутри внешней встречи и не раздаёт участникам внешней встречи права VOX-S.</small></section>
<p id="error" role="alert" hidden></p></main><script src="app.js"></script></body></html>
